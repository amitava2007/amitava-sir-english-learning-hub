.grid{
display:grid;

.stat{

.muted{

.notice{

.pill{

.lesson{
display:flex;

.lesson:last-child{

.lesson-info{

.lesson-title{
font-weight:800;

.actions{
display:flex;
gap:7px;
flex-wrap:wrap

table{
width:100%;
border-collapse:collapse;

th,td{
text-align:left;
padding:11px 8px;

}

.empty{
padding:28px;
text-align:center;
color:var(--muted)
}

.small{
font-size:12px
}

.class-chip{
display:inline-block;
padding:6px 10px;
border-radius:10px;
background:#eef3fa;
margin:3px;
font-size:12px;
font-weight:700
}

.modal{
position:fixed;
inset:0;
background:#071a2d88;
display:flex;
align-items:center;
justify-content:center;
padding:16px;
z-index:10
}

.modal-box{
background:#fff;
border-radius:18px;
padding:22px;
max-width:520px;
width:100%;
max-height:90vh;
overflow:auto
}

.checks{
display:flex;
flex-wrap:wrap;
gap:8px;
margin:7px 0 14px
}

.check{
border:1px solid #d7e0eb;
border-radius:10px;
padding:8px 10px;
background:#fff
}

.check input{
width:auto;
margin:0 5px 0 0
}

@media(max-width:720px){
.grid{
grid-template-columns:1fr
}

.lesson{
align-items:flex-start;
flex-direction:column
}

.actions{
width:100%
}

.actions button{
flex:1
}

table{
display:block;
overflow-x:auto;
white-space:nowrap
}
}
</style>
</head>
