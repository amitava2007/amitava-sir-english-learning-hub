<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MUKHERJEE ENGLISH TUTORIAL</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033
}

header{
  background:linear-gradient(135deg,#1e4f91,#2876df);
  color:#fff;
  padding:28px 6%
}

.brand{
  font-size:30px;
  font-weight:800
}

.sub{
  font-size:16px;
  margin-top:8px;
  font-weight:700
}

.wrap{
  max-width:1100px;
  margin:22px auto;
  padding:0 16px
}

.card{
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:16px;
  padding:20px;
  margin:14px 0;
  box-shadow:0 4px 18px #102a430d
}

.login{
  max-width:460px;
  margin:45px auto
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px
}

.nav{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin:15px 0
}

.nav button{
  background:#fff;
  color:#17477f;
  border:1px solid #d6deea
}

.nav button.active{
  background:#17477f;
  color:#fff
}

.stat{
  font-size:30px;
  font-weight:800
}

.muted{
  color:#687386
}

.notice{
  padding:12px;
  border-radius:10px;
  background:#eef5ff;
  margin:10px 0
}

.danger{
  padding:12px;
  border-radius:10px;
  background:#fff1f1;
  border:1px solid #f0caca;
  margin:10px 0
}

.ok{
  padding:12px;
  border-radius:10px;
  background:#effaf4;
  border:1px solid #ccebd9;
  margin:10px 0
}

label{
  display:block;
  font-weight:700;
  margin:10px 0 5px
}

input,select,textarea{
  width:100%;
  padding:11px;
  border:1px solid #d5deea;
  border-radius:9px;
  background:#fff
}

textarea{
  min-height:90px
}

button{
  border:0;
  border-radius:9px;
  padding:11px 14px;
  background:#2166c2;
  color:#fff;
  font-weight:700;
  cursor:pointer;
  margin:4px 2px
}

.gray{
  background:#667085
}

.red{
  background:#b42318
}

.green{
  background:#087443
}

.item{
  padding:14px 0;
  border-bottom:1px solid #edf0f4;
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:center
}

.pill{
  font-size:11px;
  padding:5px 8px;
  border-radius:20px;
  background:#edf2f7
}

.modal{
  position:fixed;
  inset:0;
  background:#081b2bcc;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:15px;
  z-index:20
}

.modalbox{
  background:#fff;
  border-radius:16px;
  padding:20px;
  width:100%;
  max-width:650px;
  max-height:92vh;
  overflow:auto
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:12px
}

th,td{
  text-align:left;
  padding:10px 7px;
  border-bottom:1px solid #edf0f4
}

a{
  color:#175fc0;
  font-weight:700
}

.small{
  font-size:12px
}

@media(max-width:700px){
  .grid{
    grid-template-columns:1fr
  }

  .brand{
    font-size:25px
  }

  .item{
    align-items:flex-start;
    flex-direction:column
  }

  table{
    display:block;
    overflow:auto;
    white-space:nowrap
  }
}
</style>
</head>

<body>

<header>
  <div class="brand">MUKHERJEE ENGLISH TUTORIAL</div>
  <div class="sub">KONNAGAR, HOOGHLY • Amitava Sir</div>
</header>

<main id="app" class="wrap"></main>

<script>

const SUPABASE_URL =
'https://gsytlzquntkqdekqevkj.supabase.co';

const SUPABASE_KEY =
'sb_publishable_W0MSP0P49Wx9WOR0lHz6bA_DWtEjYXG';

const sb =
supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let user=null;
let mode='student';
let tab='home';
let courses=[];
let levels=[];

const $=id=>document.getElementById(id);

const esc=v=>
String(v??'').replace(/[&<>"']/g,m=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#39;'
}[m]));

function err(e){
  console.error(e);
  alert(e?.message||String(e)||'Something went wrong.');
}


/* =========================
   START
========================= */

async function start(){

  try{

    const {
      data:{session}
    }=await sb.auth.getSession();

    if(session){

      user=session.user;

      const p=await sb
        .from('profiles')
        .select('role,full_name')
        .eq('id',session.user.id)
        .maybeSingle();

      if(p.data && p.data.role==='admin'){
        mode='admin';
        await adminHome();
      }else{
        mode='student';
        await studentHome();
      }

    }else{
      login();
    }

  }catch(e){

    document.getElementById('app').innerHTML=
    '<div class="card danger">'+
    '<b>App startup error</b><br>'+
    esc(e.message)+
    '</div>';

    console.error(e);
  }
}


/* =========================
   LOGIN
========================= */

function login(){

  document.getElementById('app').innerHTML=`

  <div class="card login">

    <h1>Welcome 👋</h1>

    <p class="muted">
      Amitava Sir English Learning Hub
    </p>

    <div class="notice">
      Students use the Student ID and password
      given by Amitava Sir.
    </div>

    <label>Login type</label>

    <select id="loginType" onchange="switchLogin()">

      <option value="student">
        Student
      </option>

      <option value="admin">
        Admin
      </option>

    </select>

    <div id="loginFields"></div>

  </div>

  `;

  switchLogin();
}


function switchLogin(){

  const admin=
    $('loginType').value==='admin';

  $('loginFields').innerHTML=

  admin?

  `

  <label>Email</label>

  <input
    id="email"
    type="email"
    placeholder="Admin email"
  >

  <label>Password</label>

  <input
    id="pass"
    type="password"
    placeholder="Admin password"
  >

  <button onclick="adminLogin()">
    Admin Login
  </button>

  `

  :

  `

  <label>Student ID</label>

  <input
    id="sid"
    placeholder="STU1001"
  >

  <label>Password</label>

  <input
    id="spass"
    type="password"
    placeholder="Password"
  >

  <button onclick="studentLogin()">
    Student Login
  </button>

  <p class="muted small">
    There is no student-side Forgot Password.
    Contact your teacher for a reset.
  </p>

  `;
}


/* =========================
   ADMIN LOGIN
========================= */

async function adminLogin(){

  try{

    const {
      data,
      error
    }=
    await sb.auth.signInWithPassword({

      email:$('email').value.trim(),

      password:$('pass').value

    });

    if(error) throw error;

    user=data.user;
    mode='admin';
    tab='home';

    await adminHome();

  }catch(e){

    err(e);

  }
}


/* =========================
   STUDENT LOGIN
========================= */

async function studentLogin(){

  try{

    const r=
    await fetch(

      SUPABASE_URL+
      '/functions/v1/student-login',

      {
        method:'POST',

        headers:{
          'Content-Type':
          'application/json'
        },

        body:JSON.stringify({

          student_id:
          $('sid').value.trim(),

          password:
          $('spass').value

        })

      }

    );

    const j=await r.json();

    if(!r.ok){

      throw new Error(
        j.error||
        'Student login failed.'
      );

    }

    if(
      j.access_token &&
      j.refresh_token
    ){

      await sb.auth.setSession({

        access_token:
        j.access_token,

        refresh_token:
        j.refresh_token

      });

    }

    user=j.student||j;

    mode='student';
    tab='home';

    await studentHome();

  }catch(e){

    err(e);

  }
}


/* =========================
   COMMON
========================= */

function top(title,sub){

  return `

  <div class="card">

    <h1>${esc(title)}</h1>

    <p class="muted">
      ${esc(sub||'')}
    </p>

  </div>

  `;
}


function nav(items){

  return `

  <div class="nav">

  ${
    items.map(x=>

      `<button
        class="${tab===x[0]?'active':''}"
        onclick="tab='${x[0]}';render()"
      >
        ${x[1]}
      </button>`

    ).join('')
  }

  <button
    class="gray"
    onclick="logout()"
  >
    Logout
  </button>

  </div>

  `;
}


async function logout(){

  await sb.auth.signOut();

  user=null;
  mode='student';

  login();
}


async function render(){

  if(mode==='admin'){

    await adminHome();

  }else{

    await studentHome();

  }

}


/* =========================
   COURSE / LEVEL DATA
========================= */

async function loadStructure(){

  const a=
  await sb
  .from('courses')
  .select('*')
  .order('name');

  if(a.error) throw a.error;

  courses=a.data||[];


  const b=
  await sb
  .from('levels')
  .select('*')
  .order('name');

  if(b.error) throw b.error;

  levels=b.data||[];

}


/* =========================
   ADMIN DASHBOARD
========================= */

async function adminHome(){

  try{

    await loadStructure();

    const [
      {count:sc},
      {count:cc},
      {count:tc},
      {count:rc}
    ]=

    await Promise.all([

      sb
      .from('students')
      .select('*',{count:'exact',head:true}),

      sb
      .from('content')
      .select('*',{count:'exact',head:true}),

      sb
      .from('tests')
      .select('*',{count:'exact',head:true}),

      sb
      .from('test_attempts')
      .select('*',{count:'exact',head:true})

    ]);


    document.getElementById('app').innerHTML=

    top(
      'Admin Dashboard',
      'Amitava Sir — full control'
    )

    +

    nav([

      ['home','📊 Dashboard'],

      ['students','👨‍🎓 Students'],

      ['content','📚 Content'],

      ['courses','📁 Courses & Groups'],

      ['tests','📝 Tests'],

      ['results','📈 Results']

    ])

    +

    (

      tab==='home'

      ?

      `

      <div class="grid">

        <div class="card">
          <div class="muted">
            Students
          </div>
          <div class="stat">
            ${sc??0}
          </div>
        </div>

        <div class="card">
          <div class="muted">
            Content
          </div>
          <div class="stat">
            ${cc??0}
          </div>
        </div>

        <div class="card">
          <div class="muted">
            Tests
          </div>
          <div class="stat">
            ${tc??0}
          </div>
        </div>

        <div class="card">
          <div class="muted">
            Attempts
          </div>
          <div class="stat">
            ${rc??0}
          </div>
        </div>

      </div>

      `

      :

      tab==='students'
      ?await studentsPage()

      :

      tab==='content'
      ?await contentPage()

      :

      tab==='courses'
      ?await coursesPage()

      :

      tab==='tests'
      ?await testsPage()

      :

      await resultsPage()

    );

  }catch(e){

    document.getElementById('app').innerHTML=

    top(
      'Admin Dashboard',
      ''
    )

    +

    `

    <div class="card danger">

      <b>Database error</b>

      <br>

      ${esc(e.message)}

    </div>

    `;

    console.error(e);

  }

}


/* =========================
   STUDENTS
========================= */

async function studentsPage(){

  const r=
  await sb
  .from('students')
  .select('*')
  .order(
    'created_at',
    {ascending:false}
  );

  if(r.error) throw r.error;


  return `

  <div class="card">

    <div
      style="
      display:flex;
      justify-content:space-between;
      gap:8px;
      align-items:center;
      flex-wrap:wrap
      "
    >

      <div>

        <h2>
          Students
        </h2>

        <p class="muted">
          Create, activate, deactivate
          or reset accounts.
        </p>

      </div>

      <button
        onclick="studentModal()"
      >
        + Create Student
      </button>

    </div>


    <table>

      <tr>
        <th>Name</th>
        <th>Student ID</th>
        <th>Course</th>
        <th>Level</th>
        <th>Status</th>
        <th>Action</th>
      </tr>

      ${
        (r.data||[]).map(s=>

        `

        <tr>

          <td>
            ${esc(s.full_name)}
          </td>

          <td>
            ${esc(
              s.student_code||
              s.student_id||
              '-'
            )}
          </td>

          <td>
            ${esc(
              (courses.find(
                c=>c.id===s.course_id
              )||{}).name||'-'
            )}
          </td>

          <td>
            ${esc(
              (levels.find(
                l=>l.id===s.level_id
              )||{}).name||'-'
            )}
          </td>

          <td>
            ${
              s.active
              ?'🟢 Active'
              :'🔒 Inactive'
            }
          </td>

          <td>

            <button
              onclick="
              setStudent(
                '${s.id}',
                ${!s.active}
              )"
            >
              ${
                s.active
                ?'Deactivate'
                :'Activate'
              }
            </button>

            <button
              class="gray"
              onclick="
              resetStudent('${s.id}')
              "
            >
              Reset
            </button>

          </td>

        </tr>

        `

        ).join('')

        ||

        `

        <tr>
          <td colspan="6">
            No students yet.
          </td>
        </tr>

        `

      }

    </table>

  </div>

  `;

}


/* =========================
   CREATE STUDENT
========================= */

function studentModal(){

  document.body.insertAdjacentHTML(

    'beforeend',

    `

    <div
      class="modal"
      id="modal"
    >

      <div class="modalbox">

        <h2>
          Create Student
        </h2>

        <label>
          Student name
        </label>

        <input id="n">

        <label>
          Course
        </label>

        <select id="c">

          ${
            courses.map(x=>

              `<option
                value="${x.id}"
              >
                ${esc(x.name)}
              </option>`

            ).join('')
          }

        </select>

        <label>
          Level / Group
        </label>

        <select id="l">

          ${
            levels.map(x=>

              `<option
                value="${x.id}"
              >
                ${esc(x.name)}
              </option>`

            ).join('')
          }

        </select>

        <p class="muted small">

          Student ID and random password
          will be generated automatically.

        </p>

        <button
          onclick="createStudent()"
        >
          Create
        </button>

        <button
          class="gray"
          onclick="closeModal()"
        >
          Cancel
        </button>

      </div>

    </div>

    `

  );

}


async function createStudent(){

  try{

    const session=
    (await sb.auth.getSession())
    .data.session;

    const r=
    await fetch(

      SUPABASE_URL+
      '/functions/v1/admin-student',

      {

        method:'POST',

        headers:{

          'Content-Type':
          'application/json',

          'Authorization':
          'Bearer '+
          session.access_token

        },

        body:JSON.stringify({

          action:'create',

          full_name:
          $('n').value.trim(),

          course_id:
          $('c').value,

          level_id:
          $('l').value

        })

      }

    );

    const j=await r.json();

    if(!r.ok){

      throw new Error(
        j.error||
        'Create failed'
      );

    }

    closeModal();

    alert(
      'Student created.\n\n'+
      'Student ID: '+
      j.student_id+
      '\nPassword: '+
      j.password
    );

    await render();

  }catch(e){

    err(e);

  }

}


async function setStudent(
  id,
  active
){

  try{

    await callStudent(
      'set_active',
      {
        student_uuid:id,
        active:active
      }
    );

    await render();

  }catch(e){

    err(e);

  }

}


async function resetStudent(id){

  try{

    const j=
    await callStudent(
      'reset_password',
      {
        student_uuid:id
      }
    );

    alert(
      'New password: '+
      j.password
    );

    await render();

  }catch(e){

    err(e);

  }

}


async function callStudent(
  action,
  body
){

  const session=
  (await sb.auth.getSession())
  .data.session;

  const r=
  await fetch(

    SUPABASE_URL+
    '/functions/v1/admin-student',

    {

      method:'POST',

      headers:{

        'Content-Type':
        'application/json',

        'Authorization':
        'Bearer '+
        session.access_token

      },

      body:JSON.stringify({

        action,
        ...body

      })

    }

  );

  const j=await r.json();

  if(!r.ok){

    throw new Error(
      j.error||
      'Action failed'
    );

  }

  return j;

}


/* =========================
   CONTENT
========================= */

async function contentPage(){

  const r=
  await sb
  .from('content')
  .select('*')
  .order(
    'created_at',
    {ascending:false}
  );

  if(r.error) throw r.error;


  return `

  <div class="card">

    <div
      style="
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:8px
      "
    >

      <div>

        <h2>
          Content Library
        </h2>

        <p class="muted">
          Notes/PDF links,
          YouTube links and tests.
        </p>

      </div>

      <button
        onclick="contentModal()"
      >
        + Add Content
      </button>

    </div>


    <table>

      <tr>
        <th>Title</th>
        <th>Type</th>
        <th>Course</th>
        <th>Level</th>
        <th>Published</th>
        <th></th>
      </tr>

      ${
        (r.data||[]).map(x=>

        `

        <tr>

          <td>
            ${esc(x.title)}
          </td>

          <td>
            ${esc(x.type)}
          </td>

          <td>
            ${esc(
              (courses.find(
                c=>c.id===x.course_id
              )||{}).name||'-'
            )}
          </td>

          <td>
            ${esc(
              (levels.find(
                l=>l.id===x.level_id
              )||{}).name||'-'
            )}
          </td>

          <td>
            ${x.published?'🟢':'🔒'}
          </td>

          <td>

            <button
              onclick="
              toggleContent(
                '${x.id}',
                ${!x.published}
              )"
            >
              ${
                x.published
                ?'Hide'
                :'Publish'
              }
            </button>

            <button
              class="red"
              onclick="
              deleteContent('${x.id}')
              "
            >
              Delete
            </button>

          </td>

        </tr>

        `

        ).join('')

        ||

        `

        <tr>
          <td colspan="6">
            No content yet.
          </td>
        </tr>

        `

      }

    </table>

  </div>

  `;

}


function contentModal(){

  document.body.insertAdjacentHTML(

    'beforeend',

    `

    <div
      class="modal"
      id="modal"
    >

      <div class="modalbox">

        <h2>
          Add Content
        </h2>

        <label>
          Title
        </label>

        <input id="ct">

        <label>
          Type
        </label>

        <select id="cy">

          <option value="Notes">
            Notes / PDF
          </option>

          <option value="Video">
            YouTube Video
          </option>

        </select>

        <label>
          Course
        </label>

        <select id="cc">

          ${
            courses.map(x=>

              `<option
                value="${x.id}"
              >
                ${esc(x.name)}
              </option>`

            ).join('')
          }

        </select>

        <label>
          Level / Group
        </label>

        <select id="cl">

          ${
            levels.map(x=>

              `<option
                value="${x.id}"
              >
                ${esc(x.name)}
              </option>`

            ).join('')
          }

        </select>

        <label>
          External URL
        </label>

        <input
          id="cu"
          placeholder="Google Drive or YouTube link"
        >

        <label>
          Description
        </label>

        <textarea id="cd"></textarea>

        <button
          onclick="saveContent()"
        >
          Save Hidden
        </button>

        <button
          class="gray"
          onclick="closeModal()"
        >
          Cancel
        </button>

      </div>

    </div>

    `

  );

}


async function saveContent(){

  try{

    const r=
    await sb
    .from('content')
    .insert({

      title:
      $('ct').value.trim(),

      type:
      $('cy').value,

      course_id:
      $('cc').value,

      level_id:
      $('cl').value,

      url:
      $('cu').value.trim(),

      description:
      $('cd').value.trim(),

      published:false

    })
    .select();

    if(r.error)
      throw r.error;

    closeModal();

    await render();

  }catch(e){

    err(e);

  }

}


async function toggleContent(
  id,
  published
){

  const r=
  await sb
  .from('content')
  .update({published})
  .eq('id',id);

  if(r.error)
    throw r.error;

  await render();

}


async function deleteContent(id){

  if(
    !confirm(
      'Delete this content?'
    )
  ) return;

  const r=
  await sb
  .from('content')
  .delete()
  .eq('id',id);

  if(r.error)
    throw r.error;

  await render();

}


/* =========================
   COURSES / LEVELS
========================= */

async function coursesPage(){

  return `

  <div class="grid">

    <div class="card">

      <h2>
        Courses
      </h2>

      ${
        courses.map(c=>

        `

        <div class="item">

          <b>
            ${esc(c.name)}
          </b>

          <span class="pill">
            Course
          </span>

        </div>

        `

        ).join('')
      }

      <button
        onclick="addCourse()"
      >
        + Add Course
      </button>

    </div>


    <div class="card">

      <h2>
        Levels / Groups
      </h2>

      ${
        levels.map(l=>

        `

        <div class="item">

          <b>
            ${esc(l.name)}
          </b>

          <span class="pill">

            ${esc(
              (courses.find(
                c=>c.id===l.course_id
              )||{}).name||''
            )}

          </span>

        </div>

        `

        ).join('')
      }

      <button
        onclick="addLevel()"
      >
        + Add Level / Group
      </button>

    </div>

  </div>

  `;

}


async function addCourse(){

  const name=
  prompt(
    'New course name'
  );

  if(!name) return;

  const r=
  await sb
  .from('courses')
  .insert({

    name:name.trim(),
    active:true

  });

  if(r.error)
    throw r.error;

  await render();

}


async function addLevel(){

  if(!courses.length){

    return alert(
      'Create a course first.'
    );

  }

  const name=
  prompt(
    'New level / group name'
  );

  if(!name) return;

  const course=
  prompt(
    'Enter the Course ID'
  );

  if(!course) return;

  const r=
  await sb
  .from('levels')
  .insert({

    name:name.trim(),

    course_id:course,

    active:true

  });

  if(r.error)
    throw r.error;

  await render();

}


/* =========================
   TESTS
========================= */

async function testsPage(){

  const r=
  await sb
  .from('tests')
  .select('*')
  .order(
    'created_at',
    {ascending:false}
  );

  if(r.error)
    throw r.error;


  return `

  <div class="card">

    <h2>
      Tests
    </h2>

    <p class="muted">
      Create 15-mark tests.
    </p>

    <button
      onclick="testModal()"
    >
      + Create 15-Mark Test
    </button>

    <table>

      <tr>
        <th>Title</th>
        <th>Course</th>
        <th>Level</th>
        <th>Marks</th>
        <th>Published</th>
      </tr>

      ${
        (r.data||[]).map(t=>

        `

        <tr>

          <td>
            ${esc(t.title)}
          </td>

          <td>
            ${esc(
              (courses.find(
                c=>c.id===t.course_id
              )||{}).name||'-'
            )}
          </td>

          <td>
            ${esc(
              (levels.find(
                l=>l.id===t.level_id
              )||{}).name||'-'
            )}
          </td>

          <td>
            ${t.total_marks}
          </td>

          <td>
            ${t.published?'🟢':'🔒'}
          </td>

        </tr>

        `

        ).join('')

      }

    </table>

  </div>

  `;

}


function testModal(){

  document.body.insertAdjacentHTML(

    'beforeend',

    `

    <div
      class="modal"
      id="modal"
    >

      <div class="modalbox">

        <h2>
          Create Test
        </h2>

        <label>
          Test title
        </label>

        <input id="tt">

        <label>
          Course
        </label>

        <select id="tc">

          ${
            courses.map(x=>

            `<option
              value="${x.id}"
            >
              ${esc(x.name)}
            </option>`

            ).join('')
          }

        </select>

        <label>
          Level / Group
        </label>

        <select id="tl">

          ${
            levels.map(x=>

            `<option
              value="${x.id}"
            >
              ${esc(x.name)}
            </option>`

            ).join('')
          }

        </select>

        <p class="notice">

          Total marks is fixed at
          <b>15</b>
          for this first test version.

        </p>

        <button
          onclick="saveTest()"
        >
          Create Test
        </button>

        <button
          class="gray"
          onclick="closeModal()"
        >
          Cancel
        </button>

      </div>

    </div>

    `

  );

}


async function saveTest(){

  try{

    const r=
    await sb
    .from('tests')
    .insert({

      title:
      $('tt').value.trim(),

      course_id:
      $('tc').value,

      level_id:
      $('tl').value,

      total_marks:15,

      published:false

    })
    .select();

    if(r.error)
      throw r.error;

    closeModal();

    alert(
      'Test created.\
Question editor will be connected next.'
    );

    await render();

  }catch(e){

    err(e);

  }

}


/* =========================
   RESULTS
========================= */

async function resultsPage(){

  const r=
  await sb
  .from('test_attempts')
  .select('*')
  .order(
    'submitted_at',
    {ascending:false}
  );

  if(r.error)
    throw r.error;


  return `

  <div class="card">

    <h2>
      Test Results
    </h2>

    <table>

      <tr>
        <th>Student</th>
        <th>Test</th>
        <th>Marks</th>
        <th>Submitted</th>
      </tr>

      ${
        (r.data||[]).map(a=>

        `

        <tr>

          <td>
            ${esc(a.student_id)}
          </td>

          <td>
            ${esc(a.test_id)}
          </td>

          <td>
            ${a.score}/${a.total_marks}
          </td>

          <td>
            ${
              a.submitted_at
              ?new Date(
                a.submitted_at
              ).toLocaleString()
              :'-'
            }
          </td>

        </tr>

        `

        ).join('')

        ||

        `

        <tr>
          <td colspan="4">
            No attempts yet.
          </td>
        </tr>

        `

      }

    </table>

  </div>

  `;

}


/* =========================
   STUDENT
========================= */

async function studentHome(){

  try{

    const r=
    await sb
    .from('content')
    .select('*')
    .eq(
      'published',
      true
    )
    .order(
      'created_at',
      {ascending:false}
    );

    if(r.error)
      throw r.error;

    const items=
    r.data||[];


    document.getElementById('app').innerHTML=

    top(
      'Student Dashboard',
      user?.full_name
      ?'Welcome, '+user.full_name
      :'Your course materials'
    )

    +

    nav([

      ['home','🏠 Home'],

      ['notes','📚 Notes'],

      ['videos','🎥 Videos'],

      ['tests','📝 Tests'],

      ['results','📈 My Results']

    ])

    +

    (

      tab==='home'

      ?

      `

      <div class="card">

        <h2>
          Available Learning
        </h2>

        ${
          items.map(studentItem)
          .join('')

          ||

          '<p class="muted">'+
          'Your teacher has not published '+
          'content yet.'+
          '</p>'
        }

      </div>

      `

      :

      tab==='notes'

      ?

      `

      <div class="card">

        <h2>
          Notes / PDFs
        </h2>

        ${
          items
          .filter(
            x=>x.type==='Notes'
          )
          .map(studentItem)
          .join('')

          ||

          '<p class="muted">'+
          'No notes available.'+
          '</p>'
        }

      </div>

      `

      :

      tab==='videos'

      ?

      `

      <div class="card">

        <h2>
          Videos
        </h2>

        ${
          items
          .filter(
            x=>x.type==='Video'
          )
          .map(studentItem)
          .join('')

          ||

          '<p class="muted">'+
          'No videos available.'+
          '</p>'
        }

      </div>

      `

      :

      tab==='tests'

      ?

      `

      <div class="card">

        <h2>
          Tests
        </h2>

        ${
          items
          .filter(
            x=>x.type==='Test'
          )
          .map(studentItem)
          .join('')

          ||

          '<p class="muted">'+
          'No tests available.'+
          '</p>'
        }

      </div>

      `

      :

      `

      <div class="card">

        <h2>
          My Results
        </h2>

        <p class="muted">
          Your submitted test results
          will appear here.
        </p>

      </div>

      `

    );

  }catch(e){

    document.getElementById('app').innerHTML=

    top(
      'Student Dashboard',
      ''
    )

    +

    `

    <div class="card danger">

      ${esc(e.message)}

    </div>

    `;

  }

}


function studentItem(x){

  const action=

    x.url

    ?

    `

    <a
      href="${esc(x.url)}"
      target="_blank"
      rel="noopener"
    >
      ${
        x.type==='Video'
        ?'Watch'
        :'Open'
      }
    </a>

    `

    :

    `

    <span class="muted">
      Link not added yet
    </span>

    `;


  return `

  <div class="item">

    <div>

      <b>
        ${esc(x.title)}
      </b>

      <div class="muted">
        ${esc(x.description||'')}
      </div>

    </div>

    <span class="pill">
      ${esc(x.type)}
    </span>

    ${action}

  </div>

  `;

}


/* =========================
   MODAL
========================= */

function closeModal(){

  document
  .getElementById('modal')
  ?.remove();

}


/* =========================
   ERROR MONITOR
========================= */

window.addEventListener(
  'error',
  e=>console.error(
    'JS error:',
    e.error||e.message
  )
);


/* =========================
   START APP
========================= */

login();

</script>

</body>
</html>
