<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MUKHERJEE ENGLISH TUTORIAL</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}
header{background:#172033;color:#fff;text-align:center;padding:18px}
header h1{margin:0;font-size:22px}
header p{margin:5px 0 0;font-size:13px}
main{max-width:1100px;margin:20px auto;padding:0 14px}
.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:15px;box-shadow:0 3px 14px #0001}
input,select,textarea,button{width:100%;padding:11px;margin-top:8px;border-radius:9px;border:1px solid #ccd5e0;font-size:15px}
textarea{min-height:100px;resize:vertical}
button{background:#172033;color:#fff;border:0;font-weight:bold;cursor:pointer}
button.blue{background:#0b6bcb}
button.red{background:#b42318}
.err{color:#b42318;background:#fff0f0;padding:10px;border-radius:8px;margin-top:12px}
.ok{color:#067647;background:#ecfdf3;padding:10px;border-radius:8px;margin-top:12px}
.muted{color:#667085}
.item{border:1px solid #e0e6ed;border-radius:10px;padding:13px;margin-top:10px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{padding:18px;border-radius:12px;background:#f8fafc;border:1px solid #e0e6ed}
.stat b{font-size:26px;display:block}
.tabs{display:flex;gap:8px;margin:15px 0;flex-wrap:wrap}
.tabs button{width:auto;flex:1;min-width:120px}
.on{background:#0b6bcb}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hide{display:none}
.badge{display:inline-block;padding:4px 8px;border-radius:20px;background:#eef4ff;font-size:12px}
@media(max-width:700px){
.grid{grid-template-columns:1fr 1fr}
.row{grid-template-columns:1fr}
.top{align-items:flex-start;flex-direction:column}
.tabs{flex-direction:column}
.tabs button{width:100%}
}
</style>
</head>

<body>

<header>
<h1>MUKHERJEE ENGLISH TUTORIAL</h1>
<p>KONNAGAR, HOOGHLY • Amitava Sir</p>
</header>

<main id="app">
<div class="card">Loading...</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL="https://gsytlzquntkqdekqevkj.supabase.co";
const SUPABASE_KEY="sb_publishable_W0MSP0P49Wx9WOR0lHz6bA_DWtEjYXG";
const API=SUPABASE_URL+"/functions/v1/smart-endpoint";

const app=document.getElementById("app");

let sb=null;
let currentUser=null;
let student=null;
let studentContent=[];
let studentTests=[];
let mode="login";
let page="home";

const esc=x=>String(x??"").replace(/[&<>"']/g,m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[m]));

function errorBox(x){
return '<div class="err">'+esc(x)+'</div>';
}

function loginPage(){

app.innerHTML=`

<div class="card" style="max-width:500px;margin:40px auto">

<h2>MUKHERJEE ENGLISH TUTORIAL</h2>

<p class="muted">Choose your login.</p>

<div class="tabs">
<button id="studentMode" class="on">Student Login</button>
<button id="adminMode">Admin Login</button>
</div>

<div id="loginArea"></div>

</div>
`;

document.getElementById("studentMode").onclick=()=>{
mode="student";
document.getElementById("studentMode").className="on";
document.getElementById("adminMode").className="";
studentLoginForm();
};

document.getElementById("adminMode").onclick=()=>{
mode="admin";
document.getElementById("adminMode").className="on";
document.getElementById("studentMode").className="";
adminLoginForm();
};

studentLoginForm();
}

function studentLoginForm(){

document.getElementById("loginArea").innerHTML=`

<h3>Student Login</h3>

<input id="sid" placeholder="Student ID">

<input id="pw" type="password" placeholder="Password">

<button id="studentLoginBtn">Login</button>

<div id="loginError"></div>
`;

document.getElementById("studentLoginBtn").onclick=studentLogin;
}

function adminLoginForm(){

document.getElementById("loginArea").innerHTML=`

<h3>Admin Login</h3>

<input id="adminEmail" type="email" placeholder="Admin email">

<input id="adminPassword" type="password" placeholder="Password">

<button id="adminLoginBtn">Login</button>

<div id="loginError"></div>
`;

document.getElementById("adminLoginBtn").onclick=adminLogin;
}

async function studentLogin(){

const sid=document.getElementById("sid").value.trim();
const pw=document.getElementById("pw").value;
const box=document.getElementById("loginError");

box.innerHTML="";

if(!sid||!pw){
box.innerHTML=errorBox("Student ID and password are required.");
return;
}

try{

const r=await fetch(API,{
method:"POST",
headers:{
"Content-Type":"application/json",
"apikey":SUPABASE_KEY
},
body:JSON.stringify({
action:"login",
student_id:sid,
password:pw
})
});

const j=await r.json();

if(!r.ok||!j.ok){
throw Error(j.error||"Login failed");
}

await sb.auth.setSession({
access_token:j.access_token,
refresh_token:j.refresh_token
});

student=j.student;

await loadStudent();

}catch(x){

box.innerHTML=errorBox(x.message);

}
}

async function adminLogin(){

const email=document.getElementById("adminEmail").value.trim();
const password=document.getElementById("adminPassword").value;
const box=document.getElementById("loginError");

box.innerHTML="";

if(!email||!password){
box.innerHTML=errorBox("Email and password are required.");
return;
}

try{

const {data,error}=await sb.auth.signInWithPassword({
email,
password
});

if(error)throw error;

currentUser=data.user;

const {data:profile,error:profileError}=await sb
.from("profiles")
.select("*")
.eq("id",currentUser.id)
.maybeSingle();

if(profileError)throw profileError;

if(profile && profile.role && profile.role!=="admin"){
await sb.auth.signOut();
throw Error("This account is not an admin account.");
}

page="overview";
await adminDashboard();

}catch(x){

box.innerHTML=errorBox(x.message);

}
}

async function apiCall(action,data={}){

const {data:s}=await sb.auth.getSession();

if(!s.session){
throw Error("Session expired. Please log in again.");
}

const r=await fetch(API,{
method:"POST",
headers:{
"Content-Type":"application/json",
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+s.session.access_token
},
body:JSON.stringify({
action,
...data
})
});

const j=await r.json();

if(!r.ok||!j.ok){
throw Error(j.error||"Request failed");
}

return j;
}

async function loadStudent(){

try{

const j=await apiCall("dashboard");

student=j.student;
studentContent=j.content||[];
studentTests=j.tests||[];

renderStudent();

}catch(x){

await sb.auth.signOut();
loginPage();

}
}

function renderStudent(){

const nav=`

<div class="card">

<div class="top">

<div>
<b>${esc(student.full_name||student.student_id||"Student")}</b>

<div class="muted">
${esc(student.course_name||"")} • ${esc(student.level_name||"")}
</div>

</div>

<button style="width:auto" onclick="logout()">Logout</button>

</div>

<div class="tabs">

<button class="${page==="home"?"on":""}" onclick="page='home';renderStudent()">
Home
</button>

<button class="${page==="content"?"on":""}" onclick="page='content';renderStudent()">
Lessons
</button>

<button class="${page==="tests"?"on":""}" onclick="page='tests';renderStudent()">
Tests
</button>

</div>

</div>
`;

let body="";

if(page==="home"){

body=`

<div class="card">

<h2>Welcome</h2>

<p>Your class-specific learning material is ready here.</p>

<div class="grid">

<div class="stat">
<b>${studentContent.length}</b>
<span>Lessons</span>
</div>

<div class="stat">
<b>${studentTests.length}</b>
<span>Tests</span>
</div>

</div>

</div>
`;
}

if(page==="content"){

body=`

<div class="card">

<h2>Lessons</h2>

${
studentContent.length
?
studentContent.map(x=>`

<div class="item">

<b>${esc(x.title)}</b>

<div class="muted">
${esc(x.type||"Lesson")}
</div>

<p>${esc(x.description||"")}</p>

${x.url
?
`<a href="${esc(x.url)}" target="_blank">Open resource</a>`
:""}

</div>

`).join("")
:
"<p class='muted'>No published lessons yet.</p>"
}

</div>
`;
}

if(page==="tests"){

body=`

<div class="card">

<h2>Tests</h2>

${
studentTests.length
?
studentTests.map(x=>`

<div class="item">

<b>${esc(x.title)}</b>

<p class="muted">
Total marks: ${esc(x.total_marks||0)}
</p>

<button onclick="openTest('${esc(x.id)}')">
Start Test
</button>

</div>

`).join("")
:
"<p class='muted'>No published tests yet.</p>"
}

</div>
`;
}

app.innerHTML=nav+body;
}

async function openTest(id){

try{

const j=await apiCall("test",{test_id:id});

const t=j.test;
const q=j.questions||[];

app.innerHTML=`

<div class="card">

<h2>${esc(t.title)}</h2>

<p class="muted">
Total marks: ${esc(t.total_marks||0)}
</p>

<form id="testForm">

${
q.map((x,i)=>`

<div class="item">

<b>${i+1}. ${esc(x.question_text)}</b>

${
(x.options||[]).map(o=>`

<label style="display:block;margin-top:9px">

<input
style="width:auto"
type="radio"
name="q${x.id}"
value="${o.id}">

${esc(o.option_text)}

</label>

`).join("")
}

</div>

`).join("")
}

<button type="button" onclick="submitTest('${esc(id)}')">
Submit Test
</button>

</form>

</div>
`;

}catch(x){

alert(x.message);

}
}

async function submitTest(id){

const answers={};

document
.querySelectorAll("#testForm input:checked")
.forEach(x=>{
answers[x.name.slice(1)]=x.value;
});

try{

const j=await apiCall("submit",{
test_id:id,
answers
});

app.innerHTML=`

<div class="card" style="text-align:center">

<h2>Result</h2>

<h1>${esc(j.score)} / ${esc(j.total_marks)}</h1>

<button onclick="page='tests';renderStudent()">
Back to Tests
</button>

</div>
`;

}catch(x){

alert(x.message);

}
}

async function adminDashboard(){

try{

const [
coursesResult,
levelsResult,
studentsResult,
contentResult,j
testsResult,
resultsResult
]=await Promise.all([

sb.from("courses").select("*").order("created_at",{ascending:false}),

sb.from("levels").select("*").order("created_at",{ascending:false}),

sb.from("students").select("*").order("created_at",{ascending:false}),

sb.from("content").select("*").order("created_at",{ascending:false}),

sb.from("tests").select("*").order("created_at",{ascending:false}),

sb.from("test_attempts").select("*")

]);

if(coursesResult.error)throw coursesResult.error;
if(levelsResult.error)throw levelsResult.error;
if(studentsResult.error)throw studentsResult.error;
if(contentResult.error)throw contentResult.error;
if(testsResult.error)throw testsResult.error;
if(resultsResult.error)throw resultsResult.error;

window.ADMIN_DATA={
courses:coursesResult.data||[],
levels:levelsResult.data||[],
students:studentsResult.data||[],
content:contentResult.data||[],
tests:testsResult.data||[],
results:resultsResult.data||[]
};

renderAdmin();

}catch(x){

app.innerHTML=`

<div class="card">

<h2>Admin Dashboard Error</h2>

${errorBox(x.message)}

<button onclick="logout()">Logout</button>

</div>
`;

}
}

const d=window.ADMIN_DATA;

const nav=`

<div>
<b>Admin Dashboard</b>
<div class="muted">MUKHERJEE ENGLISH TUTORIAL</div>
</div>

<button style="width:auto" onclick="logout()">Logout</button>

</div>

<div class="tabs">

<button class="${page==="overview"?"on":""}" onclick="page='overview';renderAdmin()">
Overview
</button>

<button class="${page==="students"?"on":""}" onclick="page='students';renderAdmin()">

</button>

</button>

</button>

</button>

</div>

</div>
`;

let body="";

if(page==="overview"){

body=`

<div class="grid">

<div class="stat">
<b>${d.courses.length}</b>
Courses
</div>

<div class="stat">
<b>${d.levels.length}</b>
Groups / Levels
</div>

<div class="stat">
<b>${d.students.length}</b>
Students
</div>

<div class="stat">
<b>${d.content.length}</b>
Content
</div>

<div class="stat">
<b>${d.tests.length}</b>
Tests
</div>

<div class="stat">
<b>${d.results.length}</b>
Results
</div>

</div>
`;
}

if(page==="students"){

body=`

<div class="card">

<h2>Students</h2>

${
d.students.length
?
d.students.map(s=>`

<div class="item">

<b>${esc(s.full_name||s.student_id||s.student_code||"Student")}</b>

<p class="muted">
ID: ${esc(s.student_id||s.student_code||"")}
</p>

<p class="muted">
Level ID: ${esc(s.level_id||"")}
</p>

</div>

`).join("")
:
"<p class='muted'>No students found.</p>"
}

</div>
`;
}

if(page==="courses"){

body=`

<div class="card">

<h2>Courses</h2>

${
d.courses.length
?
d.courses.map(c=>`

<div class="item">

<b>${esc(c.name||c.title||"Course")}</b>

<p class="muted">
${esc(c.description||"")}
</p>

</div>

`).join("")
:
"<p class='muted'>No courses found.</p>"
}

</div>

<div class="card">

<h2>Groups / Levels</h2>

${
d.levels.length
?
d.levels.map(l=>`

<div class="item">

<b>${esc(l.name||l.title||"Level")}</b>

</div>

`).join("")
:
"<p class='muted'>No levels found.</p>"
}

</div>
`;
}

if(page==="contentAdmin"){

body=`

<div class="card">

<h2>Content</h2>

${
d.content.length
?
d.content.map(c=>`

<div class="item">

<b>${esc(c.title||"Content")}</b>

<p>${esc(c.description||"")}</p>

<div class="muted">
Type: ${esc(c.type||"")}
</div>

</div>

`).join("")
:
"<p class='muted'>No content items yet.</p>"
}

</div>
`;
}

if(page==="testsAdmin"){

body=`

<div class="card">

<h2>Tests</h2>

${
d.tests.length
?
d.tests.map(t=>`

<div class="item">

<b>${esc(t.title||"Test")}</b>

<p class="muted">
Marks: ${esc(t.total_marks||0)}
</p>

</div>

`).join("")
:
"<p class='muted'>No tests yet.</p>"
}

</div>
`;
}

if(page==="results"){

body=`

<div class="card">

<h2>Results</h2>

${
d.results.length
?
d.results.map(r=>`

<div class="item">

<b>Student: ${esc(r.student_id||r.user_id||"")}</b>

<p class="muted">

</p>

<p>
Score: <b>${esc(r.score||0)}</b>
</p>

</div>

:

`;

app.innerHTML=nav+body;
}

async function logout(){

try{
await sb.auth.signOut();
}catch(e){}

currentUser=null;
student=null;
studentContent=[];
studentTests=[];
page="home";

loginPage();
}

function startApp(){

try{

if(!window.supabase){
throw Error("Supabase library did not load.");
}

sb=window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY,
{
auth:{
persistSession:true,
autoRefreshToken:true,
detectSessionInUrl:false
}
}
);

sb.auth.getSession().then(async({data})=>{

if(data.session){

currentUser=data.session.user;

const {data:profile}=await sb
.from("profiles")
.select("*")
.eq("id",currentUser.id)
.maybeSingle();

if(profile && profile.role==="admin"){

page="overview";
await adminDashboard();

}else{

await loadStudent();

}

}else{

loginPage();

}

}).catch(loginPage);

}catch(x){

app.innerHTML=
'<div class="card">'+
'<h2>System Error</h2>'+
errorBox(x.message)+
'</div>';

}
}

window.addEventListener("load",startApp);

</script>

</body>
</html>
