<script>

const SUPABASE_URL =
"https://gsytlzquntkqdekqevkj.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_W0MSP0P49Wx9WOR0lHz6bA_DWtEjYXG";

const supabase =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY
);

let currentUser=null;
let currentProfile=null;

let tab="home";

const app=document.getElementById("app");

function esc(v){
return String(v ?? "")
.replace(/[&<>"']/g,m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[m]));
}

function setLoading(){
app.innerHTML=`
<div class="card">
<h2>Loading...</h2>
<p class="muted">Please wait.</p>
</div>`;
}

function showError(msg){
app.innerHTML=`
<div class="card">
<h2>Something went wrong</h2>
<div class="error">${esc(msg)}</div>
<button onclick="location.reload()">Reload</button>
</div>`;
}

function studentEmail(studentId){
return String(studentId).trim().toLowerCase()
+"@students.amitava-english.local";
}

async function start(){

setLoading();

const {data,error}=await supabase.auth.getSession();

if(error){
showError(error.message);
return;
}

if(!data.session){
loginPage();
return;
}

await loadLoggedUser(data.session.user);
}

async function loadLoggedUser(user){

currentUser=user;

const {data:profile,error}=await supabase
.from("profiles")
.select("*")
.eq("id",user.id)
.single();

if(error){
showError(error.message);
return;
}

currentProfile=profile;

if(profile.role==="admin"){
tab="home";
await adminPage();
return;
}

const {data:student,error:studentError}=await supabase
.from("students")
.select("*")
.eq("auth_user_id",user.id)
.single();

if(studentError){
showError(studentError.message);
return;
}

if(!student.active){
await supabase.auth.signOut();
showError("This student account is inactive. Please contact Amitava Sir.");
return;
}

currentStudent=student;
tab="home";
await studentPage();
}

function loginPage(){

app.innerHTML=`

<p class="muted">
Amitava Sir's English Learning Hub
</p>

<label>Login type</label>

<select id="loginRole">
<option value="student">Student</option>
<option value="admin">Admin</option>
</select>

<label id="loginIdLabel">Student ID</label>

<input
id="loginId"
placeholder="Example: STU1001"
autocomplete="username"

<label>Password</label>

<input
id="loginPassword"
type="password"
placeholder="Enter password"
autocomplete="current-password"

Login
</button>

<div class="notice small">

If you forget your password, contact Amitava Sir.
</div>

</div>`;

document.getElementById("loginRole")
.addEventListener("change",function(){

document.getElementById("loginIdLabel").textContent=
this.value==="admin"
?"Admin Email"
:"Student ID";

document.getElementById("loginId").placeholder=
this.value==="admin"
?"Enter admin email"
:"Example: STU1001";
});
}

async function doLogin(){

const role=document.getElementById("loginRole").value;
const id=document.getElementById("loginId").value.trim();
const password=document.getElementById("loginPassword").value;

if(!id||!password){
alert("Please enter your login details.");
return;
}

const email=
role==="admin"
?id
:studentEmail(id);

const {error}=await supabase.auth.signInWithPassword({
email,
password
});

if(error){
alert("Login failed: "+error.message);
return;
}

location.reload();
}

async function logout(){

await supabase.auth.signOut();

currentUser=null;
currentProfile=null;
currentStudent=null;

loginPage();

async function openResource(id){

const {data:x,error}=await supabase
.from("content")
.select("*")
.eq("id",id)
.single();

alert(error.message);
return;
}

await openTest(x);
return;
}

if(!x.url){
alert("Your teacher has not added the link yet.");
return;
}

window.open(x.url,"_blank");
}

/* ================= TESTS ================= */

async function openTest(content){

const {data:test,error}=await supabase
.from("tests")
.select("*")
.eq("content_id",content.id)
.single();

if(error){
alert("Test is not configured yet.");
return;
}

const {data:questions,error:qError}=await supabase
.from("test_questions")
.select("*")
.eq("test_id",test.id)
.order("question_no",{ascending:true});

if(qError){
alert(qError.message);
return;
}

selectedTest={
content,
test,
questions:questions||[]
};

let html=`
<div class="modal">
<div class="modalbox">

<div class="flex">
<h2>${esc(test.title||content.title)}</h2>
<button class="secondary"
onclick="closeModal()">✕</button>
</div>

<div class="notice">
Total Marks: ${esc(test.total_marks||15)}
</div>
`;

for(let i=0;i<selectedTest.questions.length;i++){

const q=selectedTest.questions[i];

const {data:options}=await supabase
.from("test_options")
.select("*")
.eq("question_id",q.id)
.order("option_no",{ascending:true});

html+=`
<div class="item">

<b>
Q${i+1}. ${esc(q.question_text)}
</b>

<div>
${
(options||[]).map(o=>`
<label class="option">
<input
type="radio"
name="q_${q.id}"
value="${o.id}">
${esc(o.option_text)}
</label>
`).join("")
}
</div>

</div>`;
}

html+=`
<button onclick="submitTest()">
Submit Test
</button>

</div>
</div>`;

const div=document.createElement("div");
div.id="modal";
div.innerHTML=html;
document.body.appendChild(div);
}

function closeModal(){
const m=document.getElementById("modal");
if(m)m.remove();
}

async function submitTest(){

if(!selectedTest)return;

const answers=[];

for(const q of selectedTest.questions){

const selected=
document.querySelector(
`input[name="q_${q.id}"]:checked`
);

answers.push({
question_id:q.id,
selected_option_id:selected?selected.value:null
});
}

const unanswered=answers.filter(x=>!x.selected_option_id).length;

if(unanswered){
if(!confirm(
unanswered+
" question(s) are unanswered. Submit anyway?"
))return;
}

/*
The final grading/write operation will be performed
by the secure Edge Function added in the next step.
*/

alert(
"Your test interface is ready. The secure submission/grading service will be connected next."
);

closeModal();
}

async function createStudent(){

document.getElementById("newName").value.trim();

const student_id=

const password=
document.getElementById("newPassword").value;

if(!full_name||!student_id||!password){

return;
}

await callAdminFunction({
action:"create",
full_name,
student_id,
password
});
}

prompt("Enter the new password:");

if(!password)return;

await callAdminFunction({
action:"reset_password",
student_id:id,
password
});
}

async function studentStatus(id,active){

await callAdminFunction({
action:active?"activate":"deactivate",
student_id:id
});
}

async function callAdminFunction(payload){

const {data,error}=await supabase.functions.invoke(
"admin-student",
{body:payload}

"Secure student service is not connected yet."
);
return;
}

alert(data.error);
return;
}

alert(data?.message||"Done.");

closeModal();

await adminStudents();
}

async function saveContent(){

const content_type=document.getElementById("ctype").value;

const level_id=document.getElementById("clevel").value.trim();

const description=document.getElementById("cdesc").value.trim();

if(!title||!course_id||!level_id){
alert("Title, Course ID and Level ID are required.");
return;
}

const {error}=await supabase
.from("content")
.insert({
title,
content_type,
course_id,
level_id,
url:url||null,
description,
published:false
});

alert(error.message);
return;
}

alert("Content saved as hidden.");

}

async function adminResults(){

const {data,error}=await supabase
.from("test_attempts")
.select("*")
.order("created_at",{ascending:false});

if(error){
showError(error.message);
return;
}

app.innerHTML=`

<h1>📈 Test Results</h1>

${nav([
["home","📊 Dashboard"],
["students","👨‍🎓 Students"],
["content","📚 Content"],
["courses","🎓 Courses"],
["results","📈 Results"]
])}

<div class="card">

<h2>Student Test Attempts</h2>

${
data?.length
?`
<table>

<tr>
<th>Student</th>
<th>Test</th>
<th>Marks</th>
<th>Date</th>
</tr>

${data.map(a=>`

<tr>

<td>${esc(a.student_id)}</td>

<td>${esc(a.test_id)}</td>

<td>
<b>
${esc(a.score)}
/
${esc(a.total_marks)}
</b>
</td>

<td>
${a.created_at
?new Date(a.created_at).toLocaleString()
:"-"}
</td>

`).join("")}

:`<div class="empty">

}

}
