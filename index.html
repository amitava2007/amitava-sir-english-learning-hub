<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>MUKHERJEE ENGLISH TUTORIAL</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --navy:#16324f;
  --blue:#246b9e;
  --bg:#f5f7fa;
  --card:#ffffff;
  --text:#17212b;
  --muted:#667585;
  --line:#e3e8ee;
  --green:#197a4b;
  --red:#b42318;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

header{
  background:var(--navy);
  color:#fff;
  padding:18px 16px;
  text-align:center;
  position:sticky;
  top:0;
  z-index:5;
}

.brand{
  font-weight:800;
  font-size:20px;
  letter-spacing:.3px;
}

.sub{
  font-size:12px;
  opacity:.85;
  margin-top:5px;
}

.wrap{
  width:min(1050px,calc(100% - 24px));
  margin:20px auto 50px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  padding:18px;
  box-shadow:0 3px 14px #00000008;
  margin-bottom:14px;
}

.login{
  max-width:430px;
  margin:45px auto;
}

.title{
  font-size:24px;
  margin:0 0 6px;
}

.muted{
  color:var(--muted);
  font-size:13px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}

.grid3{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:12px;
}

label{
  display:block;
  font-weight:700;
  font-size:13px;
  margin:12px 0 6px;
}

input,
select,
textarea{
  width:100%;
  padding:12px;
  border:1px solid #cfd7df;
  border-radius:10px;
  background:#fff;
  font:inherit;
}

textarea{
  min-height:90px;
  resize:vertical;
}

button{
  border:0;
  border-radius:10px;
  padding:11px 15px;
  background:var(--blue);
  color:#fff;
  font-weight:700;
  cursor:pointer;
  margin:6px 4px 0 0;
}

button.secondary{
  background:#e9eef3;
  color:var(--text);
}

button.danger{
  background:var(--red);
}

button.green{
  background:var(--green);
}

button:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
}

.tabs{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-bottom:14px;
}

.tabs button{
  background:#e9eef3;
  color:var(--text);
}

.tabs button.active{
  background:var(--navy);
  color:#fff;
}

.success{
  color:var(--green);
  font-weight:700;
  margin-top:10px;
}

.error{
  color:var(--red);
  font-weight:700;
  margin-top:10px;
}

.small{
  font-size:12px;
}

.item{
  border:1px solid var(--line);
  border-radius:12px;
  padding:13px;
  margin:9px 0;
}

.pill{
  display:inline-block;
  font-size:11px;
  padding:4px 8px;
  border-radius:20px;
  background:#edf2f7;
  color:#526174;
  margin:3px 4px 0 0;
}

.tablewrap{
  overflow:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:650px;
}

th,
td{
  text-align:left;
  padding:10px;
  border-bottom:1px solid var(--line);
  font-size:13px;
  vertical-align:top;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:25px;
}

.link{
  color:var(--blue);
  font-weight:700;
  text-decoration:none;
}

.loading{
  text-align:center;
  padding:35px;
  color:var(--muted);
}

@media(max-width:700px){

  .grid,
  .grid3{
    grid-template-columns:1fr;
  }

  .wrap{
    width:min(100% - 16px,1050px);
    margin-top:12px;
  }

  .card{
    padding:15px;
  }

  .brand{
    font-size:18px;
  }
}
</style>
</head>

<body>

<header>
  <div class="brand">MUKHERJEE ENGLISH TUTORIAL</div>
  <div class="sub">KONNAGAR, HOOGHLY • Amitava Sir</div>
</header>

<div id="app" class="wrap"></div>

<script>

/* =========================================================
   V5 — STABLE SUPABASE FRONTEND

   IMPORTANT:
   Supabase is initialized LAZILY.

   Therefore:
   - Login page can load even if Supabase CDN fails.
   - No startup session call.
   - No start() function.
   - No localStorage database.
   - No Supabase secret key in browser.
   ========================================================= */


/* ---------- SECTION 1: SUPABASE CONFIGURATION ---------- */

const SUPABASE_URL =
  'https://gsytlzquntkqdekqevkj.supabase.co';

const SUPABASE_PUBLISHABLE_KEY =
  'sb_publishable_W0MSP0P49Wx9WOR0lHz6bA_DWtEjYXG';

let SB = null;

let currentUser = null;
let currentProfile = null;
let currentStudent = null;

let cache = {
  courses: [],
  levels: [],
  content: [],
  tests: [],
  students: []
};


/* ---------- SECTION 2: BASIC HELPERS ---------- */

const app = () =>
  document.getElementById('app');


const esc = value =>
  String(value ?? '').replace(
    /[&<>"']/g,
    c => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[c])
  );


const msg = (text, ok=false) =>
  '<div class="' +
  (ok ? 'success' : 'error') +
  '">' +
  esc(text) +
  '</div>';


/*
   IMPORTANT:
   We DO NOT create the Supabase client during page startup.
*/
const getSB = () => {

  if (!SB) {

    if (
      !window.supabase ||
      typeof window.supabase.createClient !== 'function'
    ) {
      throw new Error(
        'Supabase library did not load. Please refresh once.'
      );
    }

    SB = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );
  }

  return SB;
};


/* ---------- SECTION 3: ERROR SAFETY ---------- */

window.addEventListener('error', event => {

  const box = app();

  if (
    box &&
    !box.innerHTML.trim()
  ) {

    box.innerHTML =
      '<div class="card error">' +
      '<h2>Page could not start</h2>' +
      '<p>' +
      esc(event.message || 'Unknown error') +
      '</p>' +
      '<button onclick="location.reload()">Reload</button>' +
      '</div>';
  }
});


window.addEventListener(
  'unhandledrejection',
  event => {
    console.error(event.reason);
  }
);


/* ---------- SECTION 4: LOGIN SCREEN ---------- */

function renderLogin(){

  app().innerHTML = `

    <div class="card login">

      <h1 class="title">
        Welcome 👋
      </h1>

      <p class="muted">
        Amitava Sir English Learning Hub
      </p>

      <div class="tabs">

        <button
          id="studentTab"
          class="active"
          onclick="showLoginTab('student')">

          Student Login

        </button>

        <button
          id="adminTab"
          onclick="showLoginTab('admin')">

          Admin Login

        </button>

      </div>

      <div id="loginBox"></div>

    </div>

  `;

  showLoginTab('student');
}


function showLoginTab(type){

  const studentTab =
    document.getElementById('studentTab');

  const adminTab =
    document.getElementById('adminTab');

  if(studentTab){
    studentTab.classList.toggle(
      'active',
      type === 'student'
    );
  }

  if(adminTab){
    adminTab.classList.toggle(
      'active',
      type === 'admin'
    );
  }

  document.getElementById(
    'loginBox'
  ).innerHTML =

  type === 'student'

  ?

  `

    <label>Student ID</label>

    <input
      id="studentId"
      placeholder="Example: STU1001"
      autocomplete="username"
    >

    <label>Password</label>

    <input
      id="studentPassword"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button onclick="studentLogin()">
      Login
    </button>

    <p class="muted small">
      Forgot your password?
      Contact Amitava Sir.
      There is no student-side password reset.
    </p>

    <div id="loginMsg"></div>

  `

  :

  `

    <label>Admin Email</label>

    <input
      id="adminEmail"
      type="email"
      placeholder="Your Supabase admin email"
      autocomplete="username"
    >

    <label>Admin Password</label>

    <input
      id="adminPassword"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button onclick="adminLogin()">
      Admin Login
    </button>

    <div id="loginMsg"></div>

  `;
}


function setLoginMsg(text,ok=false){

  const box =
    document.getElementById('loginMsg');

  if(box){
    box.innerHTML = msg(text,ok);
  }
}


/* ---------- SECTION 5: ADMIN LOGIN ---------- */

async function adminLogin(){

  try{

    const email =
      document
      .getElementById('adminEmail')
      .value
      .trim();

    const password =
      document
      .getElementById('adminPassword')
      .value;

    if(!email || !password){

      setLoginMsg(
        'Email and password are required.'
      );

      return;
    }

    setLoginMsg(
      'Signing in…',
      true
    );

    const {
      data,
      error
    } =
      await getSB()
      .auth
      .signInWithPassword({
        email,
        password
      });

    if(error){
      throw error;
    }

    currentUser = data.user;

    await loadProfile();

    if(
      !currentProfile ||
      currentProfile.role !== 'admin'
    ){

      throw new Error(
        'This account is not an admin account.'
      );
    }

    await renderAdmin();

  }catch(error){

    setLoginMsg(
      error.message ||
      'Admin login failed.'
    );
  }
}


/* ---------- SECTION 6: STUDENT LOGIN ---------- */

async function studentLogin(){

  const id =
    document
    .getElementById('studentId')
    .value
    .trim();

  const password =
    document
    .getElementById('studentPassword')
    .value;

  if(!id || !password){

    setLoginMsg(
      'Student ID and password are required.'
    );

    return;
  }

  setLoginMsg(
    'Signing in…',
    true
  );

  try{

    /*
      Student ID/password is deliberately handled
      by a server-side Edge Function.

      The Supabase secret key is NEVER placed
      inside this browser code.
    */

    const {
      data,
      error
    } =
      await getSB()
      .functions
      .invoke(
        'quick-api',
        {
          body:{
            student_id:id,
            password:password
          }
        }
      );

    if(error){
      throw error;
    }

    if(
      !data ||
      !data.access_token ||
      !data.refresh_token
    ){

      throw new Error(
        data?.error ||
        'Student login service is not connected yet.'
      );
    }

    const {
      error:setError
    } =
      await getSB()
      .auth
      .setSession({
        access_token:data.access_token,
        refresh_token:data.refresh_token
      });

    if(setError){
      throw setError;
    }

    currentUser =
      (
        await getSB()
        .auth
        .getUser()
      ).data.user;

    await loadProfile();

    currentStudent =
      data.student || null;

    if(!currentStudent){

      await loadStudentRecord();
    }

    await renderStudent();

  }catch(error){

    setLoginMsg(
      error.message ||
      'Student login failed.'
    );
  }
}


/* ---------- SECTION 7: DATABASE HELPERS ---------- */

async function loadProfile(){

  const {
    data,
    error
  } =
    await getSB()
    .from('profiles')
    .select('*')
    .eq('id',currentUser.id)
    .maybeSingle();

  if(error){
    throw error;
  }

  currentProfile = data;
}


async function loadStudentRecord(){

  const {
    data,
    error
  } =
    await getSB()
    .from('students')
    .select('*')
    .eq(
      'auth_user_id',
      currentUser.id
    )
    .maybeSingle();

  if(error){
    throw error;
  }

  currentStudent = data;
}


async function logout(){

  try{
    await getSB()
      .auth
      .signOut();
  }catch(error){}

  currentUser = null;
  currentProfile = null;
  currentStudent = null;

  cache = {
    courses:[],
    levels:[],
    content:[],
    tests:[],
    students:[]
  };

  renderLogin();
}


/* ---------- SECTION 8: DATA FETCH ---------- */

async function fetchCourses(){

  const {
    data,
    error
  } =
    await getSB()
    .from('courses')
    .select('*')
    .order('name');

  if(error){
    throw error;
  }

  cache.courses = data || [];

  return cache.courses;
}


async function fetchLevels(){

  const {
    data,
    error
  } =
    await getSB()
    .from('levels')
    .select('*')
    .order('name');

  if(error){
    throw error;
  }

  cache.levels = data || [];

  return cache.levels;
}


async function fetchContent(){

  let query =
    getSB()
    .from('content')
    .select('*')
    .order(
      'created_at',
      {ascending:false}
    );

  if(
    !currentProfile ||
    currentProfile.role !== 'admin'
  ){

    query =
      query.eq(
        'published',
        true
      );
  }

  const {
    data,
    error
  } = await query;

  if(error){
    throw error;
  }

  cache.content = data || [];

  return cache.content;
}


async function fetchTests(){

  let query =
    getSB()
    .from('tests')
    .select('*')
    .order(
      'created_at',
      {ascending:false}
    );

  if(
    !currentProfile ||
    currentProfile.role !== 'admin'
  ){

    query =
      query.eq(
        'published',
        true
      );
  }

  const {
    data,
    error
  } = await query;

  if(error){
    throw error;
  }

  cache.tests = data || [];

  return cache.tests;
}


function courseName(id){

  const item =
    cache.courses.find(
      x => x.id === id
    );

  return item?.name || '—';
}


function levelName(id){

  const item =
    cache.levels.find(
      x => x.id === id
    );

  return item?.name || '—';
}


function studentAllowed(row){

  if(!currentStudent){
    return false;
  }

  return (
    row.course_id === currentStudent.course_id &&
    row.level_id === currentStudent.level_id
  );
}


function openExternal(url){

  if(url){
    window.open(
      url,
      '_blank',
      'noopener,noreferrer'
    );
  }
}


/* =========================================================
   SECTION 9: ADMIN DASHBOARD
   ========================================================= */

async function renderAdmin(){

  app().innerHTML = `

    <div class="bar card">

      <div>

        <h1 class="title">
          Admin Dashboard
        </h1>

        <div class="muted">
          Amitava Sir • Full Control
        </div>

      </div>

      <button
        class="secondary"
        onclick="logout()">

        Logout

      </button>

    </div>

    <div
      class="tabs"
      id="adminTabs">

      <button
        class="active"
        onclick="adminTab('overview',this)">

        Overview

      </button>

      <button
        onclick="adminTab('students',this)">

        Students

      </button>

      <button
        onclick="adminTab('courses',this)">

        Courses & Groups

      </button>

      <button
        onclick="adminTab('content',this)">

        Content

      </button>

      <button
        onclick="adminTab('tests',this)">

        Tests

      </button>

      <button
        onclick="adminTab('results',this)">

        Results

      </button>

    </div>

    <div id="adminBody"></div>

  `;

  await adminTab(
    'overview',
    document.querySelector(
      '#adminTabs button'
    )
  );
}


async function adminTab(tab,button){

  document
    .querySelectorAll(
      '#adminTabs button'
    )
    .forEach(
      b => b.classList.remove('active')
    );

  if(button){
    button.classList.add('active');
  }

  const body =
    document.getElementById(
      'adminBody'
    );

  body.innerHTML =
    '<div class="card loading">Loading…</div>';

  try{

    if(tab === 'overview'){
      return renderAdminOverview();
    }

    if(tab === 'students'){
      return renderStudents();
    }

    if(tab === 'courses'){
      return renderCourses();
    }

    if(tab === 'content'){
      return renderContentAdmin();
    }

    if(tab === 'tests'){
      return renderTestsAdmin();
    }

    if(tab === 'results'){
      return renderResultsAdmin();
    }

  }catch(error){

    body.innerHTML =
      '<div class="card">' +
      msg(
        error.message ||
        'Could not load this section.'
      ) +
      '</div>';
  }
}


async function renderAdminOverview(){

  const [
    courses,
    levels,
    content,
    tests
  ] =
    await Promise.all([
      fetchCourses(),
      fetchLevels(),
      fetchContent(),
      fetchTests()
    ]);

  document.getElementById(
    'adminBody'
  ).innerHTML = `

    <div class="grid3">

      <div class="card">
        <h2>${courses.length}</h2>
        <div class="muted">
          Courses
        </div>
      </div>

      <div class="card">
        <h2>${levels.length}</h2>
        <div class="muted">
          Groups / Levels
        </div>
      </div>

      <div class="card">
        <h2>${content.length}</h2>
        <div class="muted">
          Content Items
        </div>
      </div>

    </div>

    <div class="card">

      <h2>${tests.length}</h2>

      <div class="muted">
        Tests
      </div>

      <p class="muted">
        Supabase database connection is active.
      </p>

    </div>

  `;
}


/* ---------- STUDENTS ---------- */

async function renderStudents(){

  const {
    data,
    error
  } =
    await getSB()
    .from('students')
    .select('*')
    .order(
      'created_at',
      {ascending:false}
    );

  if(error){
    throw error;
  }

  cache.students = data || [];

  const courses =
    await fetchCourses();

  const levels =
    await fetchLevels();

  document.getElementById(
    'adminBody'
  ).innerHTML = `

    <div class="card">

      <h2>
        Create Student
      </h2>

      <p class="muted">
        Student creation uses the secure
        server-side function.
      </p>

      <div class="grid">

        <div>

          <label>
            Full Name
          </label>

          <input
            id="newName"
            placeholder="Student name">

        </div>

        <div>

          <label>
            Course
          </label>

          <select id="newCourse">

            ${courses.map(
              c =>
              `<option value="${c.id}">
                ${esc(c.name)}
              </option>`
            ).join('')}

          </select>

        </div>

        <div>

          <label>
            Group / Level
          </label>

          <select id="newLevel">

            ${levels.map(
              l =>
              `<option value="${l.id}">
                ${esc(l.name)}
              </option>`
            ).join('')}

          </select>

        </div>

      </div>

      <button
        class="green"
        onclick="createStudent()">

        Create Student

      </button>

      <div id="studentMsg"></div>

    </div>


    <div class="card">

      <h2>
        Students
      </h2>

      <div class="tablewrap">

        <table>

          <thead>

            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Course</th>
              <th>Group</th>
              <th>Status</th>
              <th>Action</th>
            </tr>

          </thead>

          <tbody>

            ${
              cache.students.length

              ?

              cache.students.map(
                student => `

                  <tr>

                    <td>
                      ${esc(
                        student.student_code || '—'
                      )}
                    </td>

                    <td>
                      ${esc(
                        student.full_name
                      )}
                    </td>

                    <td>
                      ${esc(
                        courseName(
                          student.course_id
                        )
                      )}
                    </td>

                    <td>
                      ${esc(
                        levelName(
                          student.level_id
                        )
                      )}
                    </td>

                    <td>

                      ${
                        student.active !== false

                        ?
                        '<span class="success">Active</span>'

                        :
                        '<span class="error">Inactive</span>'
                      }

                    </td>

                    <td>

                      <button
                        onclick="toggleStudent(
                          '${student.id}',
                          ${student.active !== false}
                        )">

                        ${
                          student.active !== false
                          ?
                          'Deactivate'
                          :
                          'Activate'
                        }

                      </button>

                      <button
                        class="secondary"
                        onclick="resetStudent(
                          '${student.student_code}'
                        )">

                        Reset Password

                      </button>

                      <button
                        class="danger"
                        onclick="deleteStudent(
                          '${student.id}'
                        )">

                        Delete

                      </button>

                    </td>

                  </tr>

                `
              ).join('')

              :

              `
                <tr>
                  <td
                    colspan="6"
                    class="empty">

                    No students yet.

                  </td>
                </tr>
              `
            }

          </tbody>

        </table>

      </div>

    </div>

  `;
}


/* ---------- SECURE ADMIN FUNCTION ---------- */

async function adminFunction(
  action,
  payload
){

  const {
    data,
    error
  } =
    await getSB()
    .functions
    .invoke(
      'quick-api',
      {
        body:{
          action,
          ...payload
        }
      }
    );

  if(error){
    throw error;
  }

  if(data?.error){
    throw new Error(
      data.error
    );
  }

  return data;
}


async function createStudent(){

  try{

    const name =
      document
      .getElementById('newName')
      .value
      .trim();

    const course_id =
      document
      .getElementById('newCourse')
      .value;

    const level_id =
      document
      .getElementById('newLevel')
      .value;

    if(!name){

      document.getElementById(
        'studentMsg'
      ).innerHTML =
        msg(
          'Enter the student name.'
        );

      return;
    }

    document.getElementById(
      'studentMsg'
    ).innerHTML =
      msg(
        'Creating…',
        true
      );

    const result =
      await adminFunction(
        'create',

async function addContent(){

  try{

    const title =
      document
      .getElementById('ctTitle')
      .value
      .trim();

    const type =
      document
      .getElementById('ctType')
      .value;

    const course_id =
      document
      .getElementById('ctCourse')
      .value;

    const level_id =
      document
      .getElementById('ctLevel')
      .value;

    const url =
      document
      .getElementById('ctUrl')
      .value
      .trim();

    const description =
      document
      .getElementById('ctDesc')
      .value
      .trim();

    const published =
      document
      .getElementById('ctPublished')
      .checked;

    if(!title || !url){

      document.getElementById(
        'contentMsg'
      ).innerHTML =
        msg(
          'Title and link are required.'
        );

      return;
    }

    const {
      error
    } =
      await getSB()
      .from('content')
      .insert({
        title,
        type,
        course_id,
        level_id,
        url,
        description,
        published
      });

    if(error){
      throw error;
    }

    await renderContentAdmin();

  }catch(error){

    document.getElementById(
      'contentMsg'
    ).innerHTML =
      msg(
        error.message ||
        'Could not add content.'
      );
  }
}

  published
){

/* ---------- TEST OPEN ---------- */

async function openTest(testId){

  const area =
    document.getElementById(
      'testArea'
    );

  area.innerHTML =
    '<div class="card loading">Loading test…</div>';

  try{

    const {
      data,
      error
    } =
      await getSB()
      .from('test_questions')
      .select(
        '*, test_options(*)'
      )
      .eq(
        'test_id',
        testId
      )
      .order(
        'question_no'
      );

    if(error){
      throw error;
    }

    if(
      !data ||
      !data.length
    ){

      area.innerHTML =
        '<div class="card">' +
        msg(
          'This test has no questions yet.'
        ) +
        '</div>';

      return;
    }

    const test =
      cache.tests.find(
        t => t.id === testId
      );

    area.innerHTML = `

      <div class="card">

        <h2>
          ${esc(
            test?.title ||
            'Test'
          )}
        </h2>

        <div class="muted">

          ${esc(
            test?.total_marks ||
            15
          )}
          marks

        </div>


        ${
          data.map(
            (question,index) =>
            `

              <div class="item">

                <b>

                  ${index + 1}.
                  ${esc(
                    question.question_text
                  )}

                </b>


                ${
                  (
                    question.test_options ||
                    []
                  ).map(
                    option =>
                    `

                      <label>

                        <input
                          type="radio"
                          name="q_${question.id}"
                          value="${option.id}"
                          style="width:auto">

                        ${esc(
                          option.option_text
                        )}

                      </label>

                    `
                  ).join('')
                }

              </div>

            `
          ).join('')
        }


        <button
          class="green"
          onclick="submitTest(
            '${testId}'
          )">

          Submit Test

        </button>


        <div id="submitMsg"></div>

      </div>

    `;

  }catch(error){

    area.innerHTML =
      '<div class="card">' +
      msg(
        error.message ||
        'Could not load test questions.'
      ) +
      '</div>';
  }
}

  /*

    The final secure version will submit answers

    browser code.

  const box =
